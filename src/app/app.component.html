<main class="contenedor">
  <header>
    <h1>Calculadora de IMC</h1>
    <p class="subtitulo">Índice de Masa Corporal</p>
  </header>

  <form class="formulario" (ngSubmit)="calcular()">
    <label for="nombre">Nombre</label>
    <input
      id="nombre"
      type="text"
      [(ngModel)]="nombre"
      name="nombre"
      placeholder="Escribe tu nombre"
    />

    <app-selector-sexo
      [sexoSeleccionado]="sexo"
      (sexoChange)="sexo = $event"
    ></app-selector-sexo>

    <app-indicador-numerico
      etiqueta="Peso (kg)"
      [valor]="peso"
      [paso]="1"
      [minimo]="30"
      [maximo]="200"
      (valorChange)="peso = $event"
    ></app-indicador-numerico>

    <app-indicador-numerico
      etiqueta="Altura (cm)"
      [valor]="altura"
      [paso]="1"
      [minimo]="100"
      [maximo]="220"
      (valorChange)="altura = $event"
    ></app-indicador-numerico>

    <div class="acciones">
      <button type="button" class="btn-borrar" (click)="borrar()">Borrar</button>
      <button type="submit" class="btn-calcular">Calcular</button>
    </div>
  </form>

  <p *ngIf="mensajeActual" class="mensaje">{{ mensajeActual }}</p>

  <app-listado-resultados [resultados]="resultados"></app-listado-resultados>
</main>
